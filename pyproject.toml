[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jolly-tur-mcp"
version = "0.1.1"
description = "Unofficial read-only MCP server for Jolly Tur hotels (jollytur.com) — hotel search, prices, campaigns"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "curl-cffi>=0.7,<1.0",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
jolly-tur-mcp = "jolly_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jolly_mcp"]
